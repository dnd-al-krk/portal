name: Create Baseline Release (v3.0.0)

on:
  workflow_dispatch:

jobs:
  create-baseline:
    name: Create v3.0.0 Baseline Tag and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout monorepo migration commit
        uses: actions/checkout@v4
        with:
          ref: 5f0d3ee
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create v3.0.0 tag
        run: |
          git tag -a v3.0.0 -m "Release v3.0.0 - Monorepo migration baseline"
          git push origin v3.0.0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.0.0 \
            --title "Portal v3.0.0 - Monorepo Migration" \
            --notes "**Baseline release after monorepo migration**

          This release marks the unification of the backend (Django) and frontend (React) repositories into a single monorepo structure.

          ### Changed
          - Migrated to monorepo structure
          - Combined backend and frontend into single repository
          - Established unified version tracking (VERSION file)

          **Components**: Backend + Frontend"
