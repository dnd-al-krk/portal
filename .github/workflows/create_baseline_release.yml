name: Create Baseline Release (v3.0.0)

on:
  workflow_dispatch:

jobs:
  create-baseline:
    name: Create v3.0.0 Baseline Tag and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create v3.0.0 tag
        run: |
          git tag -a v3.0.0 -m "Release v3.0.0"
          git push origin v3.0.0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.0.0 \
            --title "Portal v3.0.0" \
            --notes "**First release of the unified portal monorepo**

          This release includes:
          - Monorepo structure (backend + frontend)
          - CI/CD pipelines (backend CI, backend deploy, frontend build & deploy)
          - Pre-commit hooks (ruff formatting, YAML validation)
          - Automated versioning and release workflows
          - Production deployment automation

          **Components**: Backend + Frontend"
